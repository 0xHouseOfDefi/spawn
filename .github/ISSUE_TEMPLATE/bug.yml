name: Bug
description: Something in this repository, a connector or the SPAWN tools doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For SPAWN tools, include the tool name and the error code. Never paste tokens, keys or wallet secrets.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Package, host and version
      placeholder: "connectors/cursor, Cursor 2.4"
